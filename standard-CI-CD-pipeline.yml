
trigger:
- '*'

pool:
  vmImage: 'windows-latest'

variables:
  solution: '**/*.sln'
  buildPlatform: 'Any CPU'
  buildConfiguration: 'Release'

stages:
- stage: 'Build'
  displayName: 'Build all'
  jobs:
  - job: 'Build'
    displayName: 'Build job'
    pool:
      vmImage: 'windows-latest'

    steps:
    - task: UseDotNet@2
      displayName: 'Install latest .NET 10 SDK'
      inputs:
        packageType: 'sdk'
        version: '10.0.x'

    - task: NuGetToolInstaller@1
      inputs:
        versionSpec: 
        checkLatest: true

    - task: NuGetCommand@2
      inputs:
        restoreSolution: '$(solution)'

    - task: replacetokens@5
      displayName: 'Replace appsettings.json tokens'
      inputs:
        targetFiles: '**/*.json'
        encoding: 'auto'
        tokenPattern: 'default'
        writeBOM: true
        actionOnMissing: 'fail'
        keepToken: false
        actionOnNoFiles: 'continue'
        enableTransforms: false
        enableRecursion: false
        useLegacyPattern: false
        enableTelemetry: true

    - task: DotNetCoreCLI@2
      displayName: 'Build API project'
      inputs:
        command: 'publish'
        publishWebProjects: true
        arguments: '-r linux-x64 --output $(build.artifactStagingDirectory)'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish API'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'API_drop'
        publishLocation: 'Container'

    - task: DeleteFiles@1
      displayName: 'Delete API build artifact files'
      inputs:
        SourceFolder: '$(build.artifactStagingDirectory)'
        Contents: '**'

    - task: VSBuild@1
      displayName: 'Build SQL DB project'
      inputs:
        solution: 'Database/TaskFocusData/TaskFocusData.sqlproj'
        msbuildArgs: '/p:OutDir="$(build.artifactStagingDirectory)" /property:DSP="Microsoft.Data.Tools.Schema.Sql.SqlAzureV12DatabaseSchemaProvider"'
        platform: '$(buildPlatform)'
        configuration: '$(buildConfiguration)'

    - task: PublishBuildArtifacts@1
      displayName: 'Publish SQL Database'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'SQLdb_drop'
        publishLocation: 'Container'

    - task: DeleteFiles@1
      displayName: 'Delete SQL DB build artifact files'
      inputs:
        SourceFolder: '$(build.artifactStagingDirectory)'
        Contents: '**'

    - task: DotNetCoreCLI@2
      displayName: 'Build DesktopUI project'
      inputs:
        command: 'publish'
        publishWebProjects: false
        projects: 'UserInterface/TaskFocusDesktop/TaskFocusDesktop.csproj'
        arguments: '-p:PublishSingleFile=true -c Release --runtime win-x64 --self-contained true --output $(build.artifactStagingDirectory)'
        zipAfterPublish: false

    - task: PublishBuildArtifacts@1
      displayName: 'Publish DesktopUI'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'DesktopUI_drop'
        publishLocation: 'Container'

    - task: DeleteFiles@1
      displayName: 'Delete DesktopUI build artifact files'
      inputs:
        SourceFolder: '$(build.artifactStagingDirectory)'
        Contents: '**'
        
    - task: CmdLine@2
      displayName: 'Build EF ApiAuth DB'
      inputs:
        script: |
          dotnet tool install --global dotnet-ef --version 10.0.15
          dotnet ef migrations script -i -o $(build.artifactStagingDirectory)\migrate.sql -p API\TaskFocusAPI\TaskFocusAPI.csproj

    - task: PublishBuildArtifacts@1
      displayName: 'Publish EF ApiAuth DB'
      inputs:
        PathtoPublish: '$(Build.ArtifactStagingDirectory)'
        ArtifactName: 'AuthDB_drop'
        publishLocation: 'Container'
  
  - job: 'Test'
    displayName: 'Test API and client library'
    pool:
      vmImage: 'ubuntu-latest'

    steps:
    - task: UseDotNet@2
      inputs:
        packageType: 'sdk'
        version: '10.0.x'

    - script: dotnet test tests/TaskFocusAPI.IntegrationTests/TaskFocusAPI.IntegrationTests.csproj --configuration Release --logger trx --collect "XPlat Code Coverage" --results-directory "$(Agent.TempDirectory)/TaskFocusTests/integration"
      displayName: 'Run API integration tests'

    - script: dotnet test tests/TaskFocusUI.Library.Tests/TaskFocusUI.Library.Tests.csproj --configuration Release --logger trx --collect "XPlat Code Coverage" --results-directory "$(Agent.TempDirectory)/TaskFocusTests/unit"
      displayName: 'Run client-library unit tests'
      condition: succeededOrFailed()

    - task: PublishTestResults@2
      condition: succeededOrFailed()
      inputs:
        testResultsFormat: 'VSTest'
        searchFolder: '$(Agent.TempDirectory)/TaskFocusTests'
        testResultsFiles: '**/*.trx'

    - task: PublishCodeCoverageResults@2
      condition: succeededOrFailed()
      inputs:
        summaryFileLocation: '$(Agent.TempDirectory)/TaskFocusTests/*/*/coverage.cobertura.xml'

- stage: 'Dev'
  displayName: 'Deploy to the dev environment'
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
  - deployment: Deploy_Linux
    displayName: 'Deploy (Linux) job'
    dependsOn: Deploy_Win
    pool:
      vmImage: 'ubuntu-latest'
    environment: dev
    strategy:
      runOnce:
        deploy:

          steps:
          - download: current
            displayName: 'Download API artifact'
            artifact: API_drop

          - task: AzureWebApp@1
            displayName: 'Deploy API'
            inputs:
              azureSubscription: 'Azure subscription 1(0af9f1a9-e361-440d-926a-b29173434193)'
              appType: 'webAppLinux'
              appName: 'TaskFocusAPI'
              runtimeStack: 'DOTNETCORE|10.0'
              package: '$(Pipeline.Workspace)/API_drop/TaskFocusAPI.zip'
    
          - task: AzureWebApp@1
            displayName: 'Deploy TaskFocusWeb UI app'
            inputs:
              azureSubscription: 'Azure subscription 1(0af9f1a9-e361-440d-926a-b29173434193)'
              appType: 'webApp'
              appName: 'TaskFocus'
              package: '$(Pipeline.Workspace)/API_drop/TaskFocusWeb.zip'
              deploymentMethod: 'auto'

  - deployment: Deploy_Win
    displayName: 'Deploy (Windows) job'
    pool:
      vmImage: 'windows-latest'
    environment: dev
    strategy:
      runOnce:
        deploy:

          steps:
          - task: SqlAzureDacpacDeployment@1
            displayName: 'Deploy AuthDB'
            inputs:
              azureSubscription: 'Azure subscription 1(0af9f1a9-e361-440d-926a-b29173434193)'
              AuthenticationType: 'server'
              ServerName: '$(SQLServer)'
              DatabaseName: '$(AuthDBName)'
              SqlUsername: '$(SQLUserName)'
              SqlPassword: '$(SQLPassword)'
              deployType: 'SqlTask'
              SqlFile: '$(Pipeline.Workspace)/AuthDB_drop/migrate.sql'
              IpDetectionMethod: 'AutoDetect'

          - task: SqlAzureDacpacDeployment@1
            displayName: 'Deploy DataDB'
            inputs:
              azureSubscription: 'Azure subscription 1(0af9f1a9-e361-440d-926a-b29173434193)'
              AuthenticationType: 'server'
              ServerName: '$(SQLServer)'
              DatabaseName: '$(DataDBName)'
              SqlUsername: '$(SQLUserName)'
              SqlPassword: '$(SQLPassword)'
              deployType: 'DacpacTask'
              DeploymentAction: 'Publish'
              DacpacFile: '$(Pipeline.Workspace)/SQLdb_drop/TaskFocusData.dacpac'
              IpDetectionMethod: 'AutoDetect'