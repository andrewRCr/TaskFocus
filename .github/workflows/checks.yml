name: Checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration:
    name: API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - &checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - &dotnet
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - &nuget-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.nuget/packages
          key: >-
            nuget-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{
            hashFiles('**/*.csproj', '**/*.props', '**/*.targets', '**/[Nn]u[Gg]et.[Cc]onfig',
            '**/packages.lock.json', 'global.json', '.github/workflows/checks.yml') }}
          restore-keys: nuget-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-
      - run: scripts/check.sh integration

  clients:
    name: Client tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - *checkout
      - *dotnet
      - *nuget-cache
      - run: scripts/check.sh unit
      - run: scripts/check.sh build-desktop
      - run: scripts/check.sh publish-web

  api:
    name: API build and auth migrations
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - *checkout
      - *dotnet
      - *nuget-cache
      - run: scripts/check.sh build-api
      - name: Generate idempotent auth migration script
        shell: bash
        run: |
          dotnet tool install --tool-path "$RUNNER_TEMP/dotnet-tools" dotnet-ef --version 10.0.15
          export PATH="$RUNNER_TEMP/dotnet-tools:$PATH"
          dotnet ef migrations script -i --configuration Release --no-build \
            -p API/TaskFocusAPI/TaskFocusAPI.csproj -o "$RUNNER_TEMP/migrate.sql"
          test -s "$RUNNER_TEMP/migrate.sql"

  sql:
    name: SQL database build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - *checkout
      - name: Build TaskFocusData with SSDT
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild Microsoft.VisualStudio.Component.SQL.SSDT `
            -find 'MSBuild\Current\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild with SQL Server Data Tools was not found.' }
          & $msbuild Database/TaskFocusData/TaskFocusData.sqlproj /p:Configuration=Release /p:Platform=AnyCPU `
            /p:DSP=Microsoft.Data.Tools.Schema.Sql.SqlAzureV12DatabaseSchemaProvider

  pr-checks:
    name: PR checks
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [integration, clients, api, sql]
    if: ${{ always() }}
    steps:
      - name: Require every job to succeed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "At least one check did not succeed. Job results: $RESULTS"
              exit 1
            fi
          done
